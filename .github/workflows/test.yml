name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l str list dict set collections bytearray itertools functools json pathlib random re statistics env csv datetime urllib html base64 logging textwrap string sys shutil signal httpclient ospath subprocess py conv time hash file internal)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
